kind = "web"
previewPath = "/padel-future/"
title = "Padel Future"
version = "1.0.0"
id = "artifacts/padel-future"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/padel-future/" ]
localPort = 19570

[services.development]
run = "pnpm --filter @workspace/padel-future run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padel-future", "run", "build" ]
publicDir = "artifacts/padel-future/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19570"
BASE_PATH = "/padel-future/"
